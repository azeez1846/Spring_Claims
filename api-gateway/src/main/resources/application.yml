server:
  port: 8090

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - openid
              - profile
              - email
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  cloud:
    gateway:
      routes:
        - id: policy-service
          uri: ${POLICY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/policies/**
          filters:
            - TokenRelay=
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        - id: fnol-intake-service
          uri: ${FNOL_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/fnol/**
          filters:
            - TokenRelay=
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: adjuster-assignment-service
          uri: ${ADJUSTER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/adjusters/**
          filters:
            - TokenRelay=

        - id: reserve-settlement-service
          uri: ${RESERVE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/reserves/**
          filters:
            - TokenRelay=

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG
    com.insurtech.claims: DEBUG
